name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant_test
          POSTGRES_DB: quant_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U quant -d quant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANT_DATABASE_TESTS: "true"
      DATABASE_URL: jdbc:postgresql://localhost:5432/quant_test
      DATABASE_USERNAME: quant
      DATABASE_PASSWORD: quant_test
      PGPASSWORD: quant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Initialize original PostgreSQL schema
        run: psql -h localhost -U quant -d quant_test -f src/main/resources/db/original-initial-schema.sql
      - name: Lint and test
        run: ./gradlew build --no-daemon --max-workers=2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install contract test clients
        run: npm ci --prefix scripts --no-audit --no-fund
      - name: Local exchange and Socket.IO integration
        timeout-minutes: 2
        run: npm run integration --prefix scripts
